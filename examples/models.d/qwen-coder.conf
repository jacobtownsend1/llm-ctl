# A tuned definition — the kind this tool exists for. The flags are half the
# file; the other half is why they are what they are, which is the part you
# will want in six months when you are wondering whether to change one.
DESC="Qwen3 Coder 30B, NVFP4 + speculative decoding — daily driver"
BACKEND="vllm"
IMAGE="vllm/vllm-openai:v0.11.0"
DIR="$LLM_HOME/models/qwen3-coder-30b-nvfp4"

# Some checkpoints ship a chat template you would rather use than the one baked
# into the weights. It lives outside DIR, and llm-ctl mounts only DIR, so it
# needs a MOUNTS entry — and --chat-template below takes the CONTAINER path.
MOUNTS=("$LLM_HOME/chat-templates/qwen-coder:/templates:ro")

ENV=("PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True")

ARGS=(
  # Why this number and not the one on the model card: measure both and write
  # what you got right here, in this comment. vLLM warns that more than one
  # speculative token reruns the same MTP layer and can lower acceptance, so
  # the model card's value is a starting point, not an answer.
  --speculative-config '{"method":"mtp","num_speculative_tokens":3}'

  # Native context is 262144. Hybrid attention costs ~10 KiB/token here, so the
  # full window is affordable; on a smaller card, drop this first.
  --max-model-len 262144

  # A low value here usually looks like a mistake and is not: past some point
  # the reservation is KV this configuration cannot reach, taken from the
  # weights. Record the number you settled on and why, so the next person
  # (you, in March) does not "fix" it.
  --gpu-memory-utilization 0.40
  --max-num-seqs 4

  --enable-prefix-caching
  --tool-call-parser qwen3_xml
  --chat-template /templates/chat_template.jinja
)
