# llama.cpp serves GGUF. Point DIR at the directory and name the quantisation
# you want with MODEL_FILE — a GGUF repo usually ships several.
DESC="Gemma 3 12B, Q4_K_M"
BACKEND="llamacpp"
IMAGE="ghcr.io/ggml-org/llama.cpp:server-cuda"
DIR="$LLM_HOME/models/gemma-3-12b-gguf"
MODEL_FILE="gemma-3-12b-it-Q4_K_M.gguf"

ARGS=(
  --n-gpu-layers 99
  --ctx-size 32768
  --flash-attn
)
