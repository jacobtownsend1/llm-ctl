# No local weights: the engine pulls the checkpoint into the shared HF cache
# the first time it starts, which is slow once and fast afterwards. Handy for
# trying something before deciding to keep it.
DESC="Mistral 7B Instruct, straight from the hub"
BACKEND="vllm"
IMAGE="vllm/vllm-openai:latest"
HF_MODEL="mistralai/Mistral-7B-Instruct-v0.3"

ARGS=(--max-model-len 32768)
