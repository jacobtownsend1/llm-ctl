# BACKEND=external: a model whose own launcher owns its containers.
#
# Use it for anything that is not one `docker run` — a compose stack, a vendor
# recipe, or as here a tensor-parallel deployment spanning two machines that
# has to start the worker before the head. llm-ctl calls LAUNCHER, then watches
# CONTAINER_NAME on MODEL_PORT; stop calls STOPPER, which must tear down every
# node, not just the one llm-ctl can see.
DESC="284B MoE, TP=2 across two boxes — planning and long context"
BACKEND="external"
IMAGE="ghcr.io/example/two-node-vllm:1.0"
DIR="$LLM_HOME/hf-home/hub/models--example--big-moe"

NODES=2
MODEL_PORT=8888
CONTAINER_NAME="big-moe-head"
LAUNCHER="$LLM_HOME/recipes/big-moe/start.sh"
STOPPER="$LLM_HOME/recipes/big-moe/stop.sh"
LOGGER="$LLM_HOME/recipes/big-moe/logs.sh"

# Serving flags live in the recipe, not here: its launcher builds the command
# line for both ranks itself. ARGS would be ignored, so do not set it.
